# Relative paths are resolved against the repo root (the folder containing code/).
# Absolute paths and ~ also work.

[datasetPaths]
trainPath = "student_resource/dataset/train"
testPath = "student_resource/dataset/test"
gtPath = "student_resource/dataset/train/train_ground_truth.tsv"
validateScript = "student_resource/utils/validate_submission.py"

[outputPaths]
outputDir = "output"
matchingResultsFile = "matching_results.tsv"
candidatePairsFile = "candidate_pairs.tsv"
cacheDir = "cache"            # normalized parquet, lexicon, FAISS indexes, models (regenerable)

[gpu]
# Use the NVIDIA GPU for FAISS search and XGBoost training when one is available
# (needs requirements-gpu.txt). Falls back to CPU automatically otherwise.
useGpu = true

[retrieval]
# FAISS similarity index (Phase 4): char n-gram TF-IDF -> SVD -> FAISS, reverse assignment
embedDim = 128                # SVD dimensions per field (name, address)
nameWeight = 0.4              # search cosine = w * cos(name) + (1 - w) * cos(address)
revK = 6                      # each pool record looks up its revK nearest S1 records
revMargin = 0.10              # keep non-best S1 only within this cosine of the best one
nprobe = 24                   # IVF cells searched per query
searchChunk = 500000          # pool records embedded + searched per batch (memory bound)

[params]
# Blocking & candidate generation
maxCandidatesPerS1 = 30       # hard cap on candidates per S1 entity
maxTokenBucketSize = 1500     # inverted-index frequency ceiling for common words
minNameTokenLen = 3           # ignore 1-2 char tokens for name blocking
ngramSize = 3                 # character n-gram size

# Modeling & validation
randomSeed = 42
holdoutFrac = 0.2             # share of train S1 entities never used for fitting (the benchmark)
trainEntities = 300000        # fit-split S1 entities whose candidate pairs train the model
nFolds = 5
beta = 0.5                    # F_beta metric beta

# Decision gate search bounds
defaultTauSingleton = 0.60
defaultTauMatch = 0.55
defaultDeltaProb = 0.15
